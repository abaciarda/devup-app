name: Newsletter preparation and delivery
on:
  schedule:
    - cron: "30 3 * * *"
    - cron: "0 4 * * *"
    - cron: "17,47 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: newsletter-pipeline
  cancel-in-progress: false
jobs:
  pipeline:
    if: vars.AUTOMATION_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
      - name: Prepare morning edition from 06:30 Istanbul
        run: node scripts/run-scheduled.mjs prepare
      - name: Process confirmations independently
        if: always()
        run: node scripts/run-scheduled.mjs confirmations
      - name: Publish validated morning edition from 07:00 Istanbul and process delivery
        if: always()
        run: node scripts/run-scheduled.mjs delivery
